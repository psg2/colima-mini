[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
lefthook = "2.1.12"
shellcheck = "0.11.0"

[tasks.hooks]
description = "Install the repository Git hooks"
run = "lefthook install"

[tasks.format]
description = "Rewrite Swift sources with swift-format"
run = "swift format format --configuration .swift-format --in-place --recursive Sources Tests Package.swift"

[tasks."lint:swift"]
description = "Verify Swift formatting without changing files"
run = "swift format lint --configuration .swift-format --strict --recursive Sources Tests Package.swift"

[tasks."lint:shell"]
description = "Check Bash scripts with ShellCheck"
run = "shellcheck Scripts/*.sh"

[tasks."lint:actions"]
description = "Check GitHub Actions workflows"
run = "actionlint"

[tasks."lint:plist"]
description = "Validate the application property list"
run = "plutil -lint Resources/Info.plist"

[tasks.lint]
description = "Run static checks"
depends = ["lint:*"]

[tasks."test:unit"]
description = "Run the Swift package tests"
run = "swift test"

[tasks."test:app"]
description = "Check the built app bundle and a relocated copy"
depends = ["build"]
run = "./Scripts/test-app.sh"

# Sequential, so SwiftPM never builds twice at once in the same .build directory.
[tasks.test]
description = "Run the unit tests, then the app bundle tests"
run = ["mise run test:unit", "mise run test:app"]

[tasks.ci]
description = "Run the same quality gates as GitHub Actions"
depends = ["lint", "test"]

[tasks.scan-secrets]
description = "Scan the working tree and complete Git history with Gitleaks"
run = ["gitleaks dir --redact --verbose .", "gitleaks git --redact --verbose ."]

[tasks.check]
description = "Run every local publication gate"
depends = ["ci", "scan-secrets"]

[tasks.build]
description = "Build and ad hoc sign the app in build/"
run = "./Scripts/build.sh"

[tasks.install]
description = "Build and install the app in ~/Applications"
run = "./Scripts/build.sh --install"

[tasks.run]
description = "Build and open the app; pass --fixture PATH for sample data"
run = "./Scripts/run.sh"

[tasks.uninstall]
description = "Remove the installed app but keep its preferences"
run = "./Scripts/uninstall-local.sh --app"

[tasks.package-release]
description = "Build the universal release ZIP and checksum in build/release (COLIMA_MINI_RELEASE_SIGNING=adhoc)"
run = "./Scripts/package-release.sh"

[tasks.clean]
description = "Remove generated build artifacts"
run = "rm -rf build .build"
