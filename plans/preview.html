<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colima Mini — navigation study</title>
<style>
:root{color-scheme:dark;--harbor:#14272f;--slate:#203740;--fog:#dce8eb;--cyan:#58c6ca;--amber:#f1bd6a;--line:#36525c}*{box-sizing:border-box}body{margin:0;background:var(--harbor);color:var(--fog);font:14px -apple-system,BlinkMacSystemFont, sans-serif}button,input{font:inherit}button{color:inherit;border:1px solid var(--line);border-radius:6px;background:transparent;padding:7px 11px;cursor:pointer}button:hover{background:var(--slate)}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}button[aria-pressed=true],.selected{background:var(--slate);color:var(--cyan)}a{color:var(--cyan)}.preview{padding:9px 20px;background:var(--slate);font-size:12px;color:var(--cyan);display:flex;justify-content:space-between}.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 33px)}aside{border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:5px}.brand{font-weight:700;font-size:19px;font-family:ui-rounded,-apple-system,sans-serif;margin:4px 12px 12px;display:flex;align-items:center;gap:9px}.logo{width:28px;height:32px;color:var(--cyan)}.runtime{margin:0 12px 20px;color:#a7c0c7;font-size:12px;line-height:1.8}.dot{color:var(--cyan)}.nav{border:0;text-align:left;padding:10px 12px;width:100%;display:flex;gap:11px;align-items:center}.nav span:first-child{width:17px;text-align:center;color:#a7c0c7}.nav small{margin-left:auto}.section-label{font-size:11px;color:#a7c0c7;margin:22px 12px 5px;letter-spacing:.5px}.aside-footer{margin-top:auto;padding-top:32px}main{padding:28px 32px;min-width:0}.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}.top h1{font-size:26px;letter-spacing:-.5px;margin:0;font-weight:600;font-family:ui-rounded,-apple-system,sans-serif}.sub{color:#a7c0c7;font-size:12px;margin-top:6px}.push{margin-left:auto}.metrics{display:flex;gap:24px;padding:12px 0 20px;border-bottom:1px solid var(--line);color:#a7c0c7;font-size:12px;margin-bottom:20px}.metrics b{color:var(--fog);font-weight:500}.tools{display:flex;align-items:center;gap:10px;margin:18px 0}input{min-width:0;flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 11px;background:transparent;color:var(--fog)}.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.columns,.row{display:grid;grid-template-columns:minmax(190px,1fr) 170px 70px 80px;gap:12px;align-items:center}.columns{color:#a7c0c7;font-size:11px;padding:10px 12px}.group{border-top:1px solid var(--line)}.group-header{display:flex;align-items:center;gap:12px;padding:13px 6px}.disclosure{border:0;padding:6px;width:28px}.group-header strong{font-size:15px}.group-header .sub{margin:0}.row{width:100%;text-align:left;border:0;border-radius:6px;padding:13px 12px 13px 45px;margin-bottom:2px}.row:hover{background:var(--slate)}.name strong{display:block;font-weight:500}.name small{color:#a7c0c7;display:block;font-size:11px;margin-top:4px}.number{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;text-align:right}.state{font-size:12px}.quiet{color:#a7c0c7}.crumb{font-size:12px;margin-bottom:20px;color:#a7c0c7}.crumb button{border:0;color:var(--cyan);padding:0}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:24px 0 18px}.tabs button{border:0;border-radius:0;padding:10px 0;color:#a7c0c7}.tabs button[aria-pressed=true]{color:var(--cyan);border-bottom:2px solid var(--cyan);background:transparent}.relationship{display:flex;align-items:center;gap:12px;background:var(--slate);border-left:3px solid var(--cyan);padding:14px 16px;font-size:12px;margin:20px 0}.relationship button{border:0;padding:0;color:var(--cyan)}.relationship small{display:block;color:#a7c0c7;margin-bottom:5px}.logtools{display:flex;gap:10px;align-items:center;margin:20px 0 12px}.console{font:12px/1.9 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow:auto;min-height:330px;border:1px solid var(--line);padding:18px;border-radius:6px}.console .time{color:#a7c0c7}.console .warn{color:var(--amber)}.empty{padding:30px;border:1px dashed var(--line);color:#a7c0c7}.facts{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:20px 0}.facts dt{color:#a7c0c7}.facts dd{margin:0}.volume-row{display:grid;grid-template-columns:minmax(190px,1fr) 150px 80px;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:16px 10px;cursor:pointer}.volume-row:hover{background:var(--slate)}.disk{padding:22px 0;border-bottom:1px solid var(--line)}.disk-head{display:flex;align-items:baseline;justify-content:space-between}.disk-head strong{font-size:32px;font-weight:500;letter-spacing:-1px}.disk-head strong small{font-size:14px;color:#a7c0c7;letter-spacing:0}.bar{display:flex;height:12px;margin:18px 0 12px;background:var(--slate);border-radius:3px;overflow:hidden}.bar span{background:var(--cyan)}.legend{display:flex;gap:22px;font-size:12px;color:#a7c0c7}.storage-row{display:grid;grid-template-columns:1fr 100px 150px;column-gap:24px;padding:14px 0;border-bottom:1px solid var(--line)}.note{color:#a7c0c7;font-size:12px;line-height:1.7;max-width:660px;margin:16px 0 24px}.form{max-width:600px}.form label{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px}.form input{width:100%;accent-color:var(--cyan)}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}.notice{background:var(--slate);padding:12px 16px;border-left:3px solid var(--amber);font-size:12px;line-height:1.6}#toast{position:fixed;bottom:20px;right:20px;background:var(--slate);border:1px solid var(--line);padding:12px 18px;border-radius:6px;max-width:350px;display:none}.hidden{display:none}@media(max-width:900px){.columns,.row{grid-template-columns:minmax(140px,1fr) 100px 60px}.columns>*:last-child,.row>*:last-child{display:none}main{padding:24px 18px}.tools{flex-wrap:wrap}}@media(max-width:650px){.shell{display:block}aside{padding:10px;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-direction:row;flex-wrap:wrap}.brand{font-size:15px;width:100%;margin:0}.runtime,.section-label,.project-nav{display:none}.aside-footer{display:contents}.nav{width:auto;padding:8px;font-size:12px}.top{flex-wrap:wrap}.metrics{flex-wrap:wrap;gap:10px}.relationship{flex-wrap:wrap}.columns,.row{grid-template-columns:1fr 80px}.columns>*:nth-child(3),.row>*:nth-child(3){display:none}.row{padding-left:12px}.storage-row{grid-template-columns:1fr 85px 110px}.legend{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
[hidden]{display:none!important}
</style>
<div class="preview"><span>Design preview · synthetic data · no runtime connection</span><span>Colima Mini</span></div>
<div class="shell"><aside>
<div class="brand"><svg class="logo" viewBox="0 0 30 34" fill="none" aria-hidden="true"><path d="M8 31V16L5 11V3L10 8L13 3V12L24 15V20H17V31M9 23H17" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="20" cy="17" r="1" fill="currentColor"/></svg>Colima Mini</div>
<div class="runtime"><span class="dot">●</span> Running<br>10 CPUs · 20 GiB allocated</div>
<button class="nav selected" data-route="containers"><span>▤</span>Containers<small>6</small></button>
<button class="nav" data-route="volumes"><span>▱</span>Volumes<small>4</small></button>
<button class="nav" data-route="storage"><span>◴</span>Storage</button>
<div class="section-label">PROJECTS</div><button class="nav project-nav" data-project="demo"><span>▰</span>demo<small>3</small></button><button class="nav project-nav" data-project="workspace"><span>▰</span>workspace<small>3</small></button>
<div class="aside-footer"><button class="nav" data-route="settings"><span>⚙</span>Settings</button><div class="runtime" style="margin-top:12px;margin-bottom:0">Context: colima</div></div>
</aside><main id="main"></main></div><div id="toast" role="status"></div>
<script>
const main=document.getElementById('main');let route='containers',grouped=true,collapsed=new Set(),project=null,current='postgres',tab='Overview',paused=false;
const services={demo:[['api','Running','1.2%','86 MiB'],['postgres','Healthy','0.6%','192 MiB'],['worker','Exited (1)','—','—']],workspace:[['web','Running','0.1%','42 MiB'],['postgres','Healthy','0.4%','178 MiB'],['localstack','Healthy','0.2%','284 MiB']]};
const volumes=[['demo_db','postgres → /var/lib/postgresql/data','192 MiB',true],['workspace_db','postgres → /var/lib/postgresql/data','340 MiB',true],['workspace_cache','localstack → /var/lib/localstack','128 MiB',true],['old_demo_db','No containers attached','96 MiB',false]];
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',3500)}
function heading(title,sub,action=''){return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="push">${action}</div></div>`}
function navigate(r){route=r;const parent=r==='container'?'containers':r==='volume'?'volumes':r;document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('selected',b.dataset.route===parent);b.setAttribute('aria-current',b.dataset.route===parent?'page':'false')});render()}
function row(p,s){return `<button class="row" data-container="${s[0]}" data-owner="${p}"><span class="name"><strong>${s[0]}</strong><small>${p}-${s[0]}-1 · ${s[0]==='postgres'?'postgres:18':s[0]+':latest'}</small></span><span class="state"><span style="color:${s[1].startsWith('Exited')?'var(--amber)':'var(--cyan)'}">●</span> ${s[1]}</span><span class="number">${s[2]}</span><span class="number">${s[3]}</span></button>`}
function render(){if(route==='containers')containers();if(route==='container')container();if(route==='volumes')volumeList();if(route==='volume')volume();if(route==='storage')storage();if(route==='settings')settings()}
function containers(){let projects=project?[project]:Object.keys(services);main.innerHTML=heading(project||'Containers',`${project?3:6} containers · ${project?2:5} running`,`<button id="refresh">↻ Refresh</button>`)+`<div class="metrics"><span>Container CPU <b>0.3% of 10 CPUs</b></span><span>Memory <b>782 MiB / 20 GiB</b></span><span><b style="color:var(--amber)">1 exited with an error</b></span></div><div class="tools"><div class="seg"><button id="projects" aria-pressed="${grouped}">Projects</button><button id="flat" aria-pressed="${!grouped}">Containers</button></div>${grouped?`<button id="collapse" aria-label="${projects.every(p=>collapsed.has(p))?'Expand':'Collapse'} all projects">${projects.every(p=>collapsed.has(p))?'⊞ Expand all':'⊟ Collapse all'}</button>`:''}<input id="search" aria-label="Filter containers or projects" placeholder="Filter containers or projects"><label style="font-size:12px;white-space:nowrap"><input type="checkbox" id="running" style="width:auto"> Running only</label></div><div class="columns"><span>Project / service</span><span>Status</span><span style="text-align:right">CPU</span><span style="text-align:right">Memory</span></div><div id="groups">${projects.map(p=>grouped?`<section class="group" data-group="${p}"><div class="group-header"><button class="disclosure" data-toggle="${p}" aria-expanded="${!collapsed.has(p)}" aria-label="Toggle ${p}">${collapsed.has(p)?'›':'⌄'}</button><strong>${p}</strong><span class="sub">${p==='demo'?'2':'3'} / 3 running</span><button class="push" data-action="Project lifecycle actions will appear here.">Actions…</button></div><div class="children ${collapsed.has(p)?'hidden':''}">${services[p].map(s=>row(p,s)).join('')}</div></section>`:services[p].map(s=>row(p,s)).join('')).join('')}</div>`;document.getElementById('projects').onclick=()=>{grouped=true;render()};document.getElementById('flat').onclick=()=>{grouped=false;render()};const c=document.getElementById('collapse');if(c)c.onclick=()=>{if(projects.every(p=>collapsed.has(p)))projects.forEach(p=>collapsed.delete(p));else projects.forEach(p=>collapsed.add(p));render()};document.getElementById('refresh').onclick=()=>toast('Preview only. No Docker commands were run.');document.getElementById('search').oninput=filter;document.getElementById('running').onchange=filter}
function filter(){const q=document.getElementById('search').value.toLowerCase(),running=document.getElementById('running').checked;main.querySelectorAll('.row').forEach(r=>r.hidden=!(r.textContent.toLowerCase().includes(q)&&(!running||!r.textContent.includes('Exited'))));main.querySelectorAll('.group').forEach(g=>{g.hidden=!Array.from(g.querySelectorAll('.row')).some(r=>!r.hidden);g.querySelector('.children').classList.toggle('hidden',!q&&collapsed.has(g.dataset.group));const b=g.querySelector('.disclosure');b.setAttribute('aria-expanded',q?'true':String(!collapsed.has(g.dataset.group)))});const c=document.getElementById('collapse');if(c){c.disabled=!!q;c.title=q?'Clear the search to collapse projects':''}}
function container(){main.innerHTML=`<div class="crumb"><button id="back">← Containers</button> / ${project||'demo'} / ${current}</div>`+heading(current,`${project||'demo'}-${current}-1 · ${current==='postgres'?'postgres:18':current+':latest'}`,`<button data-action="Restart requires confirmation in the native app. This preview does not restart containers.">Restart</button> <button data-action="Stop requires confirmation in the native app. This preview does not stop containers.">Stop…</button>`)+`<div class="metrics"><span class="dot">● Healthy</span><span>CPU <b>0.6%</b></span><span>Memory <b>192 MiB</b></span><span>Started <b>2 hours ago</b></span></div><div class="tabs">${['Overview','Logs','Ports','Mounts'].map(t=>`<button data-tab="${t}" aria-pressed="${tab===t}">${t}</button>`).join('')}</div><div id="detail"></div>`;document.getElementById('back').onclick=()=>{project=null;navigate('containers')};const detail=document.getElementById('detail');if(tab==='Overview')detail.innerHTML=`<div class="relationship"><div><small>PROJECT</small>${project||'demo'}</div><span>→</span><div><small>SERVICE</small>${current}</div><span>→</span><button data-volume="demo_db"><small>PERSISTENT DATA</small>demo_db ↗</button></div><dl class="facts"><dt>Image</dt><dd>${current==='postgres'?'postgres:18':current+':latest'}</dd><dt>Health check</dt><dd>Passed · checked 20 seconds ago</dd><dt>Restart policy</dt><dd>unless-stopped</dd><dt>Published port</dt><dd>localhost:5432 → 5432 / TCP</dd></dl><div class="note">The relationship between project, service and persistent data stays visible. Open a volume to see where the data is used.</div>`;if(tab==='Logs'){detail.innerHTML=`<div class="logtools"><input id="find" placeholder="Find in logs" aria-label="Find in logs"><button id="pause">${paused?'Resume':'Pause'}</button><button id="copy">Copy visible logs</button></div><div class="sub" style="margin-bottom:12px">${paused?'Paused':'Live'} · Last 200 lines · Follow latest</div><div class="console" id="logs"></div>`;drawLogs('');document.getElementById('find').oninput=e=>drawLogs(e.target.value);document.getElementById('pause').onclick=()=>{paused=!paused;render()};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('logs').innerText);toast('Visible synthetic logs copied.')}catch{toast('Select the log text to copy it in this browser.')}}}if(tab==='Ports')detail.innerHTML=`<div class="volume-row"><div class="name"><strong>localhost:5432</strong><small>Host → container 5432 / TCP</small></div><span>PostgreSQL</span><button data-action="Copies localhost:5432 in the native app; no web URL is assumed.">Copy address</button></div><div class="note">A database port is an address, not a browser link. Web endpoints get a separate Open in browser action.</div>`;if(tab==='Mounts')detail.innerHTML=`<div class="volume-row" data-volume="demo_db"><div class="name"><strong>demo_db ↗</strong><small>Named volume → /var/lib/postgresql/data</small></div><span>Read / write</span><span class="number">192 MiB</span></div>`}
const logLines=['10:14:02.002  PostgreSQL 18 starting','10:14:02.114  WARN: configuration file uses a deprecated option','10:14:02.206  Listening on 0.0.0.0:5432','10:14:02.315  Database system is ready to accept connections'];function drawLogs(q){document.getElementById('logs').innerHTML=logLines.filter(l=>l.toLowerCase().includes(q.toLowerCase())).map(l=>`<div class="${l.includes('WARN')?'warn':''}"><span class="time">${l.slice(0,12)}</span>${l.slice(12)}</div>`).join('')||'No matching lines.'}
function volumeList(){main.innerHTML=heading('Volumes','Persistent data and the containers that use it')+`<div class="notice">Unattached means no container references this volume. It does not mean the data can be deleted safely.</div><div class="tools"><input id="vsearch" placeholder="Filter volumes" aria-label="Filter volumes"><button id="unused" aria-pressed="false">Unattached only</button></div><div>${volumes.map(v=>`<div class="volume-row" data-volume="${v[0]}" tabindex="0" role="button"><div class="name"><strong>${v[0]} ↗</strong><small>${v[1]}</small></div><span class="state">${v[3]?'● Attached':'○ Unattached'}</span><span class="number">${v[2]}</span></div>`).join('')}</div>`;let unused=false;function vf(){const q=document.getElementById('vsearch').value.toLowerCase();main.querySelectorAll('[data-volume]').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(q)||(unused&&!r.textContent.includes('Unattached')))}document.getElementById('vsearch').oninput=vf;document.getElementById('unused').onclick=e=>{unused=!unused;e.target.setAttribute('aria-pressed',unused);vf()}}
let selectedVolume='demo_db';function volume(){const v=volumes.find(x=>x[0]===selectedVolume)||volumes[0];main.innerHTML=`<div class="crumb"><button id="vback">← Volumes</button></div>`+heading(v[0],`${v[2]} · local driver · ${v[3]?'attached':'unattached'}`)+`<div class="relationship"><div><small>VOLUME</small>${v[0]}</div><span>→</span><div><small>MOUNT DESTINATION</small>/var/lib/postgresql/data</div><span>→</span><button id="owner"><small>CONTAINER</small>${v[3]?'postgres ↗':'No containers attached'}</button></div><dl class="facts"><dt>Driver</dt><dd>local</dd><dt>Use</dt><dd>${v[3]?'Referenced by a container, including when stopped':'Not referenced by any existing container'}</dd><dt>Data size</dt><dd>${v[2]}</dd></dl><div class="note">Volume paths are inside the Colima VM. A Finder action needs a verified host mapping; the app should never open a Linux path as a Mac folder.</div>`;document.getElementById('vback').onclick=()=>navigate('volumes');document.getElementById('owner').onclick=()=>{if(v[3]){current='postgres';project=v[0].split('_')[0];tab='Mounts';navigate('container')}else toast('No container references this volume.')};}
function storage(){main.innerHTML=heading('Storage','VM capacity, Docker objects and Mac footprint',`<button data-action="Refresh storage on demand in the native app.">↻ Refresh</button>`)+`<section class="disk"><div class="disk-head"><div><div class="sub">COLIMA DATA DISK</div><strong>8.5 <small>GiB used</small></strong></div><span class="quiet">100 GiB configured capacity</span></div><div class="bar"><span style="width:8.5%"></span></div><div class="legend"><span>8.5 GiB filesystem usage</span><span>84.3 GiB available</span><span>Remaining: filesystem overhead / reserved blocks</span></div></section><div class="note">Configured capacity is the virtual disk limit. It is not preallocated space on your Mac. Available space can be lower than capacity minus used space because the filesystem also has metadata and reserved blocks.</div><div class="storage-row quiet"><span>Docker objects</span><span class="number">Used</span><span class="number">Reclaimable estimate</span></div>${[['Images','6.6 GiB','2.7 GiB'],['Volumes','1.8 GiB','1.0 GiB'],['Container layers','6.4 MiB','0 B'],['Build cache','241 MiB','89 MiB']].map(r=>`<div class="storage-row"><span>${r[0]}</span><span class="number">${r[1]}</span><span class="number">${r[2]}</span></div>`).join('')}<div class="note">Docker categories can share data. Reclaimable is a daemon estimate; it is not a promise of Mac space recovered. Unattached volume data may still matter.</div><div class="disk-head" style="margin-top:28px"><div><div class="sub">SPACE OCCUPIED ON MAC · VM IMAGES</div><strong>20.3 <small>GiB</small></strong></div><button id="report">Review unused containers</button></div><div class="note">Sparse disk files can retain allocated blocks after Docker deletes data. Show the physical file footprint separately from VM filesystem usage.</div>`;document.getElementById('report').onclick=()=>toast('Report only: list candidates, reasons and uncertainty. Nothing is deleted.')}
function settings(){main.innerHTML=heading('Settings','Default Colima profile · saved and running values shown separately')+`<div class="form"><h3>Virtual machine resources</h3><label for="cpu">CPU cores <b id="cv">10</b></label><input id="cpu" type="range" min="1" max="12" value="10"><label for="memory">Memory <b id="mv">20 GiB</b></label><input id="memory" type="range" min="1" max="32" step="0.5" value="20"><div class="note">Current VM: 10 CPUs · 20 GiB. Saving schedules the change for the next start. Applying now restarts Colima and interrupts running containers.</div><div class="actions"><button id="revert">Revert</button><button data-action="Preview only. No profile file is written.">Save for next start</button><button data-action="The native app will confirm a VM restart. This preview changes nothing.">Apply & restart…</button></div></div>`;document.getElementById('cpu').oninput=e=>document.getElementById('cv').textContent=e.target.value;document.getElementById('memory').oninput=e=>document.getElementById('mv').textContent=e.target.value+' GiB';document.getElementById('revert').onclick=render}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-volume]');if(!b)return;if(b.dataset.route){project=null;navigate(b.dataset.route)}if(b.dataset.project){project=b.dataset.project;navigate('containers')}if(b.dataset.container){current=b.dataset.container;project=b.dataset.owner;tab='Overview';navigate('container')}if(b.dataset.toggle){collapsed.has(b.dataset.toggle)?collapsed.delete(b.dataset.toggle):collapsed.add(b.dataset.toggle);render()}if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.volume){selectedVolume=b.dataset.volume;navigate('volume')}if(b.dataset.action)toast(b.dataset.action)});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-volume][role=button]')){e.preventDefault();e.target.click()}});navigate('containers');
</script>
</html>
