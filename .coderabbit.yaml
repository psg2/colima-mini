# CodeRabbit configuration: https://docs.coderabbit.ai/reference/configuration
language: "en"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!Resources/app-icon.png"
    - "!docs/images/**"
    - "!build/**"
    - "!.build/**"
  path_instructions:
    - path: "Sources/**"
      instructions: |
        This is a native macOS dashboard for Docker on Colima. Every Docker
        command must select the `colima` context. Flag removals that skip
        confirmation, use force, or can reach named volumes outside an explicit
        per-volume or Compose down action; sample mode running any mutation;
        and secrets shown unmasked. Code must pass `mise run lint:swift` and
        compile with Swift warnings treated as errors.
    - path: "Scripts/**"
      instructions: |
        Scripts target Bash 3.2 or newer and must pass ShellCheck. Tests use
        fake executables and must never stop the developer's Colima VM.

chat:
  auto_reply: true
